<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Markdown and LaTeX editor</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="preload" href="assets/fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/bebas-neue-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="vendor/katex/katex.min.css">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/workspace.css">
<link rel="stylesheet" href="css/markdown.css">
<link rel="stylesheet" href="css/export.css">
<style>
/* @import is the user's own code, used only by the quote icon; Inter stays the body font. */
@import url('https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap'); /* unslop-ignore FONT-IMPORT, FONT-CDN user provided this exact import for the quote icon */
</style>
</head>
<body>

<header class="app-header">
    <div class="title-group">
        <h1 class="app-title" data-icon="appMark"><span class="visually-hidden">Markdown + LaTeX</span></h1>
        <label class="visually-hidden" for="fileNameInput">File name</label>
        <input id="fileNameInput" class="file-name-input" type="text" value="untitled.md" spellcheck="false" autocomplete="off">
    </div>
    <div class="header-actions">
        <div class="action-group">
            <button type="button" class="button" id="newButton" data-icon="filePlus" aria-label="New document" title="New document"><span class="button-label">New document</span></button>
            <button type="button" class="button" id="openButton" data-icon="openFile" aria-label="Open file" title="Open a local file (Ctrl+O)"><span class="button-label">Open file</span></button>
        </div>
        <div class="action-group">
            <div class="segmented" role="group" aria-label="Layout">
                <button type="button" class="button" data-view-mode="edit" data-icon="edit" aria-pressed="false" aria-label="Editor view" title="Editor view"><span class="button-label">Editor</span></button>
                <button type="button" class="button" data-view-mode="split" data-icon="split" aria-pressed="true" aria-label="Split view" title="Split view"><span class="button-label">Split</span></button>
                <button type="button" class="button" data-view-mode="preview" data-icon="eye" aria-pressed="false" aria-label="Preview view" title="Preview view"><span class="button-label">Preview</span></button>
            </div>
            <button type="button" class="button" id="syncScrollButton" data-icon="syncScroll" aria-pressed="true" aria-label="Sync scroll" title="Sync scroll"><span class="button-label">Sync scroll</span></button>
            <button type="button" class="button" id="themeButton" data-icon="sun" aria-label="Light theme" title="Light theme"><span class="button-label">Light theme</span></button>
        </div>
        <div class="action-group">
            <button type="button" class="button button-primary" id="exportPdfButton" data-icon="pdf" aria-label="Export PDF" title="Export PDF"><span class="button-label">Export PDF</span></button>
            <div class="overflow-menu">
                <button type="button" class="button menu-trigger" id="overflowButton" data-icon="more" aria-haspopup="menu" aria-expanded="false" aria-label="More actions" title="More actions"></button>
                <div class="menu" id="overflowMenu" role="menu" aria-label="More actions" hidden>
                    <button type="button" class="menu-item" id="downloadButton" role="menuitem" data-icon="download" title="Download the Markdown source (Ctrl+S)"><span class="menu-label">Download .md</span></button>
                    <button type="button" class="menu-item" id="exportHtmlButton" role="menuitem" data-icon="htmlExport" title="Export HTML"><span class="menu-label">Export HTML</span></button>
                    <button type="button" class="menu-item" id="printButton" role="menuitem" data-icon="print" title="Print"><span class="menu-label">Print</span></button>
                    <div class="menu-separator" role="separator"></div>
                    <button type="button" class="menu-item menu-item-radio" role="menuitemradio" data-paper-size="a4" aria-checked="true" title="Paper size: A4"><span class="menu-label">A4</span></button>
                    <button type="button" class="menu-item menu-item-radio" role="menuitemradio" data-paper-size="letter" aria-checked="false" title="Paper size: Letter (8.5 × 11)"><span class="menu-label">Letter (8.5 × 11)</span></button>
                    <button type="button" class="menu-item menu-item-radio" role="menuitemradio" data-paper-size="folio" aria-checked="false" title="Paper size: Folio / Long (8.5 × 13)"><span class="menu-label">Folio / Long (8.5 × 13)</span></button>
                    <button type="button" class="menu-item menu-item-radio" role="menuitemradio" data-paper-size="legal" aria-checked="false" title="Paper size: Legal (8.5 × 14)"><span class="menu-label">Legal (8.5 × 14)</span></button>
                </div>
            </div>
        </div>
    </div>
</header>

<div class="tab-bar">
    <div class="tabs" id="tabs" role="group" aria-label="Open documents"></div>
    <button type="button" class="tab-new" id="newTabButton" data-icon="plus" aria-label="New tab" title="New tab (Ctrl+Alt+T)"></button>
</div>

<input type="file" id="fileInput" accept=".md,.markdown,.mdown,.txt,.tex,text/markdown,text/plain" hidden>

<div class="toolbar" id="toolbar" role="toolbar" aria-label="Formatting">
    <div class="toolbar-group segment" role="group" aria-label="Inline formatting">
        <button type="button" class="button" data-format="bold" aria-label="Bold" title="Bold (Ctrl+B)"><strong>B</strong></button>
        <button type="button" class="button" data-format="italic" aria-label="Italic" title="Italic (Ctrl+I)"><em>I</em></button>
        <button type="button" class="button" data-format="strikethrough" aria-label="Strikethrough" title="Strikethrough"><s>S</s></button>
        <button type="button" class="button" data-format="inlineCode" aria-label="Inline code" title="Inline code">&lt;/&gt;</button>
    </div>
    <div class="toolbar-group toolbar-dropdown">
        <button type="button" class="button menu-trigger" id="headingMenuButton" aria-haspopup="menu" aria-expanded="false" aria-controls="headingMenu" aria-label="Text level: H1" title="Text level: H1"><span id="headingTriggerLabel">H1</span><span class="chevron" data-icon="chevron"></span></button>
        <div class="menu" id="headingMenu" role="menu" aria-label="Text level" hidden>
            <button type="button" class="menu-item" role="menuitem" data-format="heading1">Heading 1<span class="menu-hint">#</span></button>
            <button type="button" class="menu-item" role="menuitem" data-format="heading2">Heading 2<span class="menu-hint">##</span></button>
            <button type="button" class="menu-item" role="menuitem" data-format="heading3">Heading 3<span class="menu-hint">###</span></button>
            <button type="button" class="menu-item" role="menuitem" data-format="heading4">Heading 4<span class="menu-hint">####</span></button>
            <button type="button" class="menu-item" role="menuitem" data-format="paragraph">Paragraph</button>
        </div>
    </div>
    <div class="toolbar-group toolbar-dropdown">
        <button type="button" class="button menu-trigger" id="listsMenuButton" aria-haspopup="menu" aria-expanded="false" aria-controls="listsMenu">Lists<span class="chevron" data-icon="chevron"></span></button>
        <div class="menu" id="listsMenu" role="menu" aria-label="Lists" hidden>
            <button type="button" class="menu-item" role="menuitem" data-format="bulletList">Bulleted list<span class="menu-hint">-</span></button>
            <button type="button" class="menu-item" role="menuitem" data-format="orderedList">Numbered list<span class="menu-hint">1.</span></button>
            <button type="button" class="menu-item" role="menuitem" data-format="taskList">Task list<span class="menu-hint">- [ ]</span></button>
        </div>
    </div>
    <div class="toolbar-group toolbar-dropdown">
        <button type="button" class="button menu-trigger" id="insertMenuButton" aria-haspopup="menu" aria-expanded="false" aria-controls="insertMenu">Insert<span class="chevron" data-icon="chevron"></span></button>
        <div class="menu" id="insertMenu" role="menu" aria-label="Insert" hidden>
            <button type="button" class="menu-item" role="menuitem" data-format="link">Link<span class="menu-hint">Ctrl+K</span></button>
            <button type="button" class="menu-item" role="menuitem" data-format="image">Image</button>
            <button type="button" class="menu-item" role="menuitem" data-format="table">Table</button>
            <button type="button" class="menu-item" role="menuitem" data-format="quote">Quote<span class="menu-hint">&gt;</span></button>
            <button type="button" class="menu-item" role="menuitem" data-format="codeBlock">Code block<span class="menu-hint">```</span></button>
            <button type="button" class="menu-item" role="menuitem" data-format="horizontalRule">Horizontal rule<span class="menu-hint">---</span></button>
        </div>
    </div>
    <div class="toolbar-group toolbar-dropdown">
        <button type="button" class="button menu-trigger" id="mathMenuButton" aria-haspopup="menu" aria-expanded="false" aria-controls="mathMenu">Math<span class="chevron" data-icon="chevron"></span></button>
        <div class="menu" id="mathMenu" role="menu" aria-label="Math" hidden>
            <button type="button" class="menu-item" role="menuitem" data-format="inlineMath">Inline equation<span class="menu-hint">$</span></button>
            <button type="button" class="menu-item" role="menuitem" data-format="blockMath">Display block<span class="menu-hint">$$</span></button>
            <div class="menu-separator" role="separator"></div>
            <button type="button" class="menu-item" role="menuitem" data-format="fraction">Fraction</button>
            <button type="button" class="menu-item" role="menuitem" data-format="squareRoot">Square root</button>
            <button type="button" class="menu-item" role="menuitem" data-format="summation">Summation</button>
            <button type="button" class="menu-item" role="menuitem" data-format="integral">Integral</button>
            <button type="button" class="menu-item" role="menuitem" data-format="matrix">Matrix</button>
            <button type="button" class="menu-item" role="menuitem" data-format="alignEnvironment">Align environment</button>
        </div>
    </div>
</div>

<main class="workspace" id="workspace" data-view="split">
    <section class="editor-pane" aria-label="Markdown editor">
        <textarea id="editor" class="editor" aria-label="Markdown source" spellcheck="false" autocomplete="off" autocapitalize="off" autocorrect="off"></textarea>
    </section>
    <div id="divider" class="divider" role="separator" aria-orientation="vertical" aria-label="Resize editor and preview" aria-valuemin="20" aria-valuemax="80" aria-valuenow="50" tabindex="0"></div>
    <section class="preview-pane" id="previewPane" aria-label="Rendered preview">
        <article id="preview" class="markdown-body"></article>
    </section>
</main>

<footer class="status-bar">
    <span id="wordCount">0 words</span>
    <span id="characterCount">0 characters</span>
    <span id="readingTime">0 min read</span>
    <span id="saveStatus" role="status">Not saved yet</span>
    <span id="notice" class="notice" role="status"></span>
</footer>

<script type="text/markdown" id="sampleDocument"># Markdown and LaTeX editor

Write on the left, read on the right. Everything below is live, so edit any of it.

## Math

Inline math sits in a sentence: $E = mc^2$, or with the alternate syntax \(a^2 + b^2 = c^2\).

Block math gets its own line:

$$
\int_{-\infty}^{\infty} e^{-x^2}\,dx = \sqrt{\pi}
$$

Environments work without dollar signs:

\begin{align}
(a + b)^2 &= a^2 + 2ab + b^2 \\
\sum_{k=1}^{n} k &= \frac{n(n+1)}{2}
\end{align}

A price like $5 is left alone, and an escaped \$ stays a dollar sign.

## Text and tables

**Bold**, *italic*, ~~strikethrough~~, `inline code`, and [links](https://katex.org).

| Quantity | Symbol | Unit |
|---|---:|---|
| Force | $F$ | newton |
| Pressure | $p$ | pascal |
| Stress | $\sigma$ | pascal |

> Quotes get a raised surface and a big accent quote mark.

## Task list

- [x] Render Markdown
- [x] Render LaTeX
- [ ] Export this page as a PDF

## Code

```javascript
function area(radius) {
    return Math.PI * radius ** 2;
}
```

```python
def moment(force, distance):
    return force * distance
```
</script>

<div class="modal-overlay" id="modalOverlay" hidden>
    <div class="modal" role="alertdialog" aria-modal="true" aria-labelledby="modalMessage">
        <p class="modal-message" id="modalMessage"></p>
        <div class="modal-actions">
            <button type="button" class="button" id="modalCancelButton">Cancel</button>
            <button type="button" class="button button-primary" id="modalConfirmButton">OK</button>
        </div>
    </div>
</div>

<script src="vendor/marked/marked.min.js"></script>
<script src="vendor/dompurify/purify.min.js"></script>
<script src="vendor/katex/katex.min.js"></script>
<script src="vendor/prism/prism-core.min.js"></script>
<script src="vendor/prism/prism-autoloader.min.js"></script>
<script src="vendor/html2pdf/html2pdf.bundle.min.js"></script>
<!-- Load order: core.js first, app.js last. -->
<script src="js/core.js"></script>
<script src="js/svg.js"></script>
<script src="js/utils.js"></script>
<script src="js/math.js"></script>
<script src="js/render.js"></script>
<script src="js/documents.js"></script>
<script src="js/export.js"></script>
<script src="js/editor.js"></script>
<script src="js/layout.js"></script>
<script src="js/app.js"></script>
</body>
</html>
